<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Lumen Relay browser smoke harness</title></head>
<body>
  <h1>Lumen Relay browser smoke harness</h1>
  <pre id="smoke-report">SMOKE_RUNNING</pre>
  <iframe id="game" title="Baseline Lumen Relay under test" src="../index.html" width="1050" height="800"></iframe>
  <iframe id="step" title="Relay Window step mode under test" src="../spikes/step-routing.html" width="1050" height="800"></iframe>
  <iframe id="double-step" title="Double Pass step mode under test" src="../spikes/step-routing.html?level=double-pass" width="1050" height="800"></iframe>
  <iframe id="recorder" title="Local playtest recorder under test" src="../evaluate.html" width="1050" height="800"></iframe>
  <iframe id="live" title="Timed Relay Window under test" src="../spikes/live-routing.html" width="1050" height="800"></iframe>
  <iframe id="double-live" title="Timed Double Pass under test" src="../spikes/double-pass.html" width="1050" height="800"></iframe>
  <iframe id="mobile" title="375px baseline mobile layout" src="../index.html" width="375" height="760"></iframe>
  <iframe id="mobile-step" title="375px step mode mobile layout" src="../spikes/step-routing.html?level=double-pass" width="375" height="760"></iframe>
  <iframe id="entry" title="Pages root game entry under test" src="../../../index.html" width="900" height="700"></iframe>
  <script>
    // Same-origin iframe exercises the actual browser UI without app-specific hooks.
    const report = document.getElementById('smoke-report');
    const entry = document.getElementById('entry');
    const game = document.getElementById('game');
    const step = document.getElementById('step');
    const doubleStep = document.getElementById('double-step');
    const mobile = document.getElementById('mobile');
    const mobileStep = document.getElementById('mobile-step');
    const recorder = document.getElementById('recorder');
    const live = document.getElementById('live');
    const doubleLive = document.getElementById('double-live');
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
    let checks = 0;
    function check(condition, message) {
      if (!condition) throw new Error(message);
      checks++;
    }
    async function until(predicate, description, timeout = 8000) {
      const end = Date.now() + timeout;
      while (Date.now() < end) {
        if (predicate()) return;
        await sleep(35);
      }
      throw new Error('Timed out: ' + description);
    }
    function cell(doc, coordinates) {
      const tile = doc.querySelector('#board [data-key="' + coordinates + '"]');
      check(tile && tile.tagName === 'BUTTON', 'Mirror button missing: ' + coordinates);
      return tile;
    }
    function rotate(doc, coordinates) {
      const tile = cell(doc, coordinates);
      check(!tile.disabled, 'Mirror unexpectedly disabled: ' + coordinates);
      const before = tile.textContent;
      tile.click();
      check(tile.textContent !== before, 'Mirror did not rotate: ' + coordinates);
      check(/(slash|backslash) orientation/.test(tile.getAttribute('aria-label') || ''),
        'Mirror orientation missing from accessible name: ' + coordinates);
    }
    async function shoot(doc, expectedState) {
      const fire = doc.getElementById('fire');
      check(!fire.disabled, 'Send pulse unexpectedly disabled');
      fire.click();
      await until(() => doc.getElementById('status').dataset.state === expectedState,
        'Pulse did not report ' + expectedState);
    }
    function playStepMode(doc, flips, beforeFlips = 0) {
      check(Boolean(doc), 'Step mode iframe did not load');
      check(doc.getElementById('advance').disabled, 'Advance enabled before beginning');
      doc.getElementById('begin').click();
      check(!doc.getElementById('advance').disabled, 'Begin did not enable step controls');
      for (let i = 0; i < beforeFlips; i++) doc.getElementById('advance').click();
      for (const coordinates of flips) rotate(doc, coordinates);
      let advances = 0;
      while (doc.getElementById('status').dataset.state === 'ready' && advances++ < 60) {
        doc.getElementById('advance').click();
      }
      check(advances < 60, 'Step mode got stuck without terminal outcome');
      return doc.getElementById('status').dataset.state;
    }
    function mobileBoardCheck(frame, mirrorKey) {
      const doc = frame.contentDocument;
      check(Boolean(doc), 'Mobile game iframe did not load');
      const boardFrame = doc.querySelector('.board-frame');
      check(boardFrame.scrollWidth > boardFrame.clientWidth + 50,
        'Board should scroll instead of expanding the page: frame ' +
        boardFrame.clientWidth + '/' + boardFrame.scrollWidth +
        ', viewport ' + frame.contentWindow.innerWidth +
        ', page ' + doc.documentElement.scrollWidth);
      check(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth + 1,
        'Mobile page itself horizontally overflows instead of containing board scroll');
      const mirror = cell(doc, mirrorKey);
      const rect = mirror.getBoundingClientRect();
      check(rect.width >= 44 && rect.height >= 44,
        'Mirror touch target below 44px on 375px phone: ' + rect.width + 'x' + rect.height);
      const hint = doc.querySelector('.mobile-scroll-hint');
      check(Boolean(hint) && frame.contentWindow.getComputedStyle(hint).display !== 'none',
        'Mobile horizontal-scroll hint is not visible');
      const before = boardFrame.scrollLeft;
      boardFrame.scrollLeft = boardFrame.scrollWidth;
      check(boardFrame.scrollLeft > before,
        'Board does not respond to horizontal scroll');
    }
    async function run() {
      try {
        const doc = game.contentDocument;
        check(Boolean(doc), 'Game iframe did not load');
        check(doc.querySelectorAll('#board .tile').length === 63,
          'Initial 9x7 board is missing');
        check(doc.querySelectorAll('#board button').length === 1,
          'First level should introduce exactly one mirror');
        check(doc.getElementById('next').hidden, 'Next button visible before win');
        check(doc.getElementById('sound').getAttribute('aria-pressed') === 'false',
          'Sound must default off');
        check(doc.getElementById('undo').disabled, 'Undo should start disabled');
        const teachingMirror = cell(doc, '3,3');
        const initialAngle = teachingMirror.textContent;
        rotate(doc, '3,3');
        check(!doc.getElementById('undo').disabled, 'Undo should enable after a mirror turn');
        doc.getElementById('undo').click();
        check(teachingMirror.textContent === initialAngle, 'Undo should restore the mirror angle');
        check(doc.getElementById('turns').textContent === '0', 'Undo should restore net turn count');
        check(doc.getElementById('undo').disabled, 'Undo should disable when history becomes empty');
        check(/backslash orientation/.test(teachingMirror.getAttribute('aria-label') || ''),
          'Undo must restore the accessible orientation label');

        await shoot(doc, 'fail');
        rotate(doc, '3,3');
        await shoot(doc, 'win');
        check(!doc.getElementById('next').hidden, 'Next button missing after first win');

        doc.getElementById('next').click();
        check(doc.getElementById('level-title').textContent === 'The Detour',
          'Next puzzle did not load');
        rotate(doc, '3,5');
        rotate(doc, '6,1');
        await shoot(doc, 'win');

        doc.getElementById('next').click();
        check(doc.getElementById('level-title').textContent === 'Crossed Wires',
          'Third puzzle did not load');
        rotate(doc, '2,1');
        rotate(doc, '7,5');
        rotate(doc, '7,2');
        await shoot(doc, 'win');
        check(doc.getElementById('next').textContent.includes('Play again'),
          'Completion replay control missing');

        doc.getElementById('next').click();
        check(doc.getElementById('level-title').textContent === 'First Light',
          'Replay did not return to first puzzle');
        doc.getElementById('fire').click();
        doc.getElementById('reset').click();
        check(doc.getElementById('shots').textContent === '0',
          'Reset did not clear shots during in-flight pulse');
        await sleep(1800);
        check(doc.getElementById('status').dataset.state === 'ready',
          'Cancelled in-flight pulse mutated reset state');
        check(doc.getElementById('next').hidden, 'Reset leaked completed-level state');

        const stepDoc = step.contentDocument;
        check(stepDoc.getElementById('level-title').textContent === 'Relay Window',
          'Step mode did not load Relay Window');
        check(playStepMode(stepDoc, ['2,4', '6,1']) === 'win',
          'Relay Window step mode did not complete correctly');
        check(stepDoc.getElementById('turns').textContent === '2',
          'Step mode did not count both rotations');
        stepDoc.getElementById('reset').click();
        check(stepDoc.getElementById('steps').textContent === '0', 'Step-mode reset did not clear steps');

        const doubleDoc = doubleStep.contentDocument;
        check(doubleDoc.getElementById('level-title').textContent === 'Double Pass',
          'Step mode did not select Double Pass fixture');
        check(playStepMode(doubleDoc, ['4,3']) === 'fail',
          'Premature Double Pass rotation should fail');
        doubleDoc.getElementById('reset').click();
        check(playStepMode(doubleDoc, ['4,3'], 2) === 'win',
          'Between-visits Double Pass rotation should win without a timer');
        check(doubleDoc.getElementById('turns').textContent === '1',
          'Double Pass step win should require one rotation');

        const recorderDoc = recorder.contentDocument;
        check(Boolean(recorderDoc.getElementById('save-session')), 'Recorder did not initialize');
        recorderDoc.getElementById('candidate').value = 'double-pass-step';
        recorderDoc.getElementById('discoverability').value = 'Smoke test: candidate link discovered';
        recorderDoc.getElementById('save-session').click();
        check(recorderDoc.querySelectorAll('#saved-list .saved-item').length === 1,
          'Recorder did not show the locally saved observation');
        const saved = JSON.parse(recorder.contentWindow.localStorage.getItem(
          'lumen-relay-playtest-records-v1'));
        check(saved.length === 1 && saved[0].candidate === 'double-pass-step',
          'Recorder saved the wrong candidate to local storage');
        check(saved[0].observations.discoverability.includes('Smoke test'),
          'Recorder dropped the written observation');
        check(recorderDoc.getElementById('status').textContent.includes('Nothing was uploaded'),
          'Recorder did not disclose local-only save behavior');
        recorderDoc.querySelector('#saved-list .saved-actions button:last-child').click();
        check(recorderDoc.querySelectorAll('#saved-list .saved-item').length === 0,
          'Recorder delete action did not remove observation');
        check(JSON.parse(recorder.contentWindow.localStorage.getItem(
          'lumen-relay-playtest-records-v1')).length === 0,
          'Recorder delete left persistent data behind');

        const liveDoc = live.contentDocument;
        check(Boolean(liveDoc), 'Timed Relay Window iframe did not load');
        check(cell(liveDoc, '2,4').disabled, 'Timed Relay Window mirror unlocked before launch');
        liveDoc.getElementById('launch').click();
        check(!cell(liveDoc, '2,4').disabled, 'Timed Relay Window mirror stayed locked in flight');
        await until(() => liveDoc.getElementById('status').dataset.state === 'fail',
          'Timed Relay Window no-flip attempt did not fail', 12000);
        liveDoc.getElementById('reset').click();
        liveDoc.getElementById('launch').click();
        rotate(liveDoc, '2,4');
        rotate(liveDoc, '6,1');
        await until(() => liveDoc.getElementById('status').dataset.state === 'win',
          'Timed Relay Window in-flight rotations did not win', 12000);
        check(liveDoc.getElementById('turns').textContent === '2',
          'Timed Relay Window should record two in-flight turns');

        const doubleLiveDoc = doubleLive.contentDocument;
        check(Boolean(doubleLiveDoc), 'Timed Double Pass iframe did not load');
        check(cell(doubleLiveDoc, '4,3').disabled, 'Timed Double Pass mirror unlocked before launch');
        doubleLiveDoc.getElementById('launch').click();
        check(!cell(doubleLiveDoc, '4,3').disabled, 'Timed Double Pass mirror stayed locked in flight');
        rotate(doubleLiveDoc, '4,3');
        await until(() => doubleLiveDoc.getElementById('status').dataset.state === 'fail',
          'Timed Double Pass early rotation did not fail', 12000);

        doubleLiveDoc.getElementById('reset').click();
        doubleLiveDoc.getElementById('launch').click();
        await until(() => doubleLiveDoc.getElementById('passes').textContent === '1',
          'Timed Double Pass never reached first mirror visit', 12000);
        check(doubleLiveDoc.getElementById('status').dataset.state === 'ready',
          'Timed Double Pass terminated before its between-visits window');
        rotate(doubleLiveDoc, '4,3');
        await until(() => doubleLiveDoc.getElementById('status').dataset.state === 'win',
          'Timed Double Pass between-visits rotation did not win', 12000);
        check(doubleLiveDoc.getElementById('turns').textContent === '1',
          'Timed Double Pass win should require one between-visits turn');
        check(doubleLiveDoc.getElementById('passes').textContent === '2',
          'Timed Double Pass winning run should visit the live mirror twice');

        mobileBoardCheck(mobile, '3,3');
        mobileBoardCheck(mobileStep, '4,3');

        const entryDoc = entry.contentDocument;
        check(Boolean(entryDoc.querySelector('main#game-entry')),
          'Pages root did not load the game entry');
        const choose = entryDoc.querySelector('a[href="./experiments/lumen-relay/modes.html"]');
        check(Boolean(choose), 'Pages root is missing the mode selector link');
        choose.click();
        await until(() => entry.contentDocument.title.includes('Choose a Game Mode'),
          'Pages root did not navigate to the game mode selector');
        check(entry.contentDocument.querySelectorAll('.mode-card').length === 5,
          'Pages entry did not reach all five playable modes');

        report.textContent = '__LUMEN_SMOKE_PASS__ ' + checks + ' checks';
        document.body.dataset.smoke = 'pass';
      } catch (error) {
        report.textContent = '__LUMEN_SMOKE_FAIL__ ' + (error.stack || error.message);
        document.body.dataset.smoke = 'fail';
      }
    }
    window.addEventListener('load', () => { void run(); });
  </script>
</body>
</html>
